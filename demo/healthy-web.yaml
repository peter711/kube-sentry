apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: ai-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: app
          image: nginx:alpine
          ports:
            - containerPort: 80
