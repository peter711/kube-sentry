apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-agent
  namespace: ai-lab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-agent-worker
  namespace: ai-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-agent-api
  namespace: ai-lab
rules:
  - apiGroups: [""]
    resources:
      - pods
      - events
      - services
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - pods/log
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - jobs/status
    verbs: ["create", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-agent-worker
  namespace: ai-lab
rules:
  - apiGroups: [""]
    resources:
      - pods
      - events
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-agent-api
  namespace: ai-lab
subjects:
  - kind: ServiceAccount
    name: ai-agent
    namespace: ai-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-agent-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-agent-worker
  namespace: ai-lab
subjects:
  - kind: ServiceAccount
    name: ai-agent-worker
    namespace: ai-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-agent-worker
