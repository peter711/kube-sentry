apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent
  namespace: ai-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-agent
  template:
    metadata:
      labels:
        app: ai-agent
    spec:
      serviceAccountName: ai-agent
      securityContext:
        fsGroup: 10001
      containers:
        - name: ai-agent
          image: ai-agent:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: TARGET_NAMESPACE
              value: ai-lab
            - name: OPENAI_MODEL
              value: gpt-5.6-luna
            - name: AGENT_DB_PATH
              value: /data/agent.db
            - name: WORKER_IMAGE
              value: ai-agent:dev
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-api
                  key: OPENAI_API_KEY
          volumeMounts:
            - name: agent-data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: agent-data
          persistentVolumeClaim:
            claimName: ai-agent-data
