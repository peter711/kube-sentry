apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: ai-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: tempo}
  template:
    metadata:
      labels: {app: tempo}
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:3.0.2
          args: ["-config.file=/etc/tempo/tempo.yaml"]
          ports:
            - {name: http, containerPort: 3200}
            - {name: otlp-grpc, containerPort: 4317}
          volumeMounts:
            - {name: config, mountPath: /etc/tempo}
            - {name: data, mountPath: /var/tempo}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 400m, memory: 512Mi}
      volumes:
        - name: config
          configMap:
            name: tempo-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: ai-lab
spec:
  selector: {app: tempo}
  ports:
    - {name: http, port: 3200, targetPort: http}
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
