apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ai-lab
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    scrape_configs:
      - job_name: otel-collector-exported-metrics
        static_configs:
          - targets: ["otel-collector:8889"]
